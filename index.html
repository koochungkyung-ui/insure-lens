<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보험 돋보기</title>
  <meta name="description" content="내 보험을 쉽게 들여다보는 도구. 실손보험 세대 확인부터 시작합니다.">
  <style>
    :root { --bg: #f5f7fb; --card: #ffffff; --text: #1f2937; --muted: #6b7280; --accent: #0f766e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111827; --card: #1f2937; --text: #f3f4f6; --muted: #9ca3af; --accent: #2dd4bf; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
           background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif; padding: 16px; }
    .card { background: var(--card); border-radius: 16px; padding: 32px 24px; max-width: 420px; width: 100%; text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .08); }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0; color: var(--muted); line-height: 1.6; }
    .badge { display: inline-block; margin-top: 16px; padding: 6px 14px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>🔍 보험 돋보기</h1>
    <p>내 보험을 쉽게 들여다보는 도구를 준비하고 있어요.<br>첫 기능은 실손보험 세대 확인 계산기예요.</p>
    <span class="badge">준비 중</span>
  </main>
</body>
</html>
